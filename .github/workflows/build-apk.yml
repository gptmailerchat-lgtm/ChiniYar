name: Build and Release ChiniYar APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          validate-wrappers: false

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools"

      - name: Clean
        run: gradle --no-daemon clean

      - name: Build compact signed Release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ChiniYar-v0.5.${GITHUB_RUN_NUMBER}.apk

      - name: Upload compact APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiniyar-release-apk
          path: ChiniYar-v0.5.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and attach APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.5.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "ChiniYar-v0.5.${GITHUB_RUN_NUMBER}.apk" \
            --title "ChiniYar $TAG" \
            --notes "ChiniYar Android release. Includes compact R8-shrunk APK, on-demand OCR model, offline metro maps with station labels, Yajing Chinese branding, and 30+ practical phrases. Built from ${GITHUB_SHA}." \
            --latest
